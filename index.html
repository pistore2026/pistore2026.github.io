<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PI | فروشگاه</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}

header{
  background:linear-gradient(135deg,#6b46c1,#8b5cf6);
  color:white;
  padding:25px 18px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header p{
  margin:0;
  font-size:15px;
}

main{
  padding:18px;
  max-width:700px;
  margin:auto;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px 12px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.icon{
  font-size:40px;
  margin-bottom:8px;
}

.name{
  font-weight:bold;
  margin-bottom:8px;
}

.price{
  color:#6b46c1;
  font-weight:bold;
  margin-bottom:12px;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:11px;
  background:#6b46c1;
  color:white;
  font-size:14px;
  cursor:pointer;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
  box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

nav span{
  font-size:12px;
  text-align:center;
}
</style>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
const PI_CLIENT_ID = "OtAJlVeii3-iL0pITVz_ceFNVmKv5VIKQohuL9ZOWho";
</script>
</head>

<body>

<script>
Pi.init({
  version: "2.0",
  sandbox: false
});

Pi.authenticate(
  ["username", "payments"],
  function(auth) {
    console.log("ورود موفق:", auth.user.username);
  },
  function(error) {
    console.log("خطا:", error);
  }
);
</script>

<script>
function piSignIn() {
  const state = crypto.randomUUID();
  sessionStorage.setItem("pi_oauth_state", state);

  Pi.signIn({
    clientId: "OtAJlVeii3-iL0pITVz_ceFNVmKv5VIKQohuL9ZOWho",
    redirectUri: "https://pistore2026.github.io/signin/callback",
    scopes: ["username"],
    state: state
  });
}
</script>
 <button type="button" onclick="piSignIn()">ورود با Pi</button> 
<header>
<h1>🟣 PI | فروشگاه</h1>
<p>فروشگاه فارسی محصولات و خدمات پی</p>
</header>

<main>

<input class="search" type="text" placeholder="🔎 جستجوی محصول...">

<div class="grid">

<div class="card">
<div class="icon">🪙</div>
<div class="name">خدمات PI</div>
<div class="price">قیمت: توافقی</div>
<button type="button" onclick="alert('خدمات آنلاین PI')">مشاهده</button>
</div>

<div class="card">
<div class="icon">💎</div>
<div class="name">محصولات دیجیتال</div>
<div class="price">قیمت: 1 PI</div>
<button type="button" onclick="paywithPi()">خرید</button>
</div>

<div class="card">
<div class="icon">📱</div>
<div class="name">خدمات آنلاین</div>
<div class="price">پرداخت با PI</div>
<button type="button" onclick="alert('خدمات آنلاین')">مشاهده</button>
</div>

<div class="card">
<div class="icon">🛍️</div>
<div class="name">فروشگاه</div>
<div class="price">محصولات متنوع</div>
<button type="button" onclick="alert('ورود به فروشگاه')">ورود</button>
</div>

</div>

</main>

<nav>
<span>🏠<br>خانه</span>
<span>🛒<br>سبد خرید</span>
<span>👤<br>حساب من</span>
</nav>

<script>
function paywithPi() {

  Pi.createPayment(
    {
      amount: 1,
      memo: "خرید از PiStore",
      metadata: {
        product: "محصول دیجیتال"
      }
    },
    {
      onReadyForServerApproval: function(paymentId) {
        console.log("Payment ID:", paymentId);
      },

      onReadyForServerCompletion: function(paymentId, txid) {
        console.log("Transaction:", txid);
      },

      onCancel: function(paymentId) {
        console.log("پرداخت لغو شد");
      },

      onError: function(error, payment) {
        console.log("خطا:", error);
      }
    }
  );
}
</script>

</body>
</html>
